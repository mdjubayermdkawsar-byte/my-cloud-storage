<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>আমার ক্লাউড সার্ভার ও হোস্টিং প্ল্যাটফর্ম</title>
  <style>
    body { font-family: sans-serif; background: #0b0f19; color: white; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin-top: 0; }
    input[type="text"], textarea { width: 95%; padding: 12px; background: #020617; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; font-family: monospace; margin-bottom: 12px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0369a1; }
    .url-box { margin-top: 15px; padding: 15px; background: #020617; border-radius: 6px; border: 1px solid #22c55e; display: none; }
    a { color: #4ade80; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ ক্লাউড সার্ভার ও ওয়েবসাইট হোস্টিং হাব</h1>

  <!-- ওয়েবসাইট হোস্টিং সেকশন -->
  <div class="card">
    <h2>🚀 এক ক্লিকে ওয়েবসাইট লাইভ হোস্ট করুন</h2>
    <p style="color: #94a3b8;">যেকোনো HTML, CSS, JS কোড নিচে পেস্ট করুন এবং লাইভ লিঙ্ক পেয়ে যান (আনলিমিটেড সাইট হোস্ট করতে পারবেন):</p>
    
    <input type="text" id="siteName" placeholder="ওয়েবসাইটের নাম (যেমন: My-Portfolio)"><br>
    
    <textarea id="htmlCode" style="height: 180px;" placeholder="তোমার HTML/CSS/JS কোড এখানে পেস্ট করো..."><!DOCTYPE html>
<html>
<head>
  <title>আমার লাইভ ওয়েবসাইট</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #111; color: white; }
    h1 { color: #38bdf8; }
  </style>
</head>
<body>
  <h1>🎉 হ্যালো ওয়ার্ল্ড!</h1>
  <p>এই ওয়েবসাইটটি সম্পূর্ণ ফ্রিতে আমাদের নিজস্ব ক্লাউড সার্ভার থেকে হোস্ট করা হয়েছে!</p>
</body>
</html></textarea><br>

    <button onclick="deployWebsite()">🌐 ওয়েবসাইট হোস্ট করো</button>

    <div class="url-box" id="urlBox">
      <p style="color: #22c55e; margin: 0 0 10px 0;"><b>✅ ওয়েবসাইট সফলভাবে লাইভ হয়েছে!</b></p>
      <span>লাইভ লিঙ্ক: </span><a id="siteLink" href="#" target="_blank"></a>
    </div>
  </div>
</div>

<script>
  async function deployWebsite() {
    const siteName = document.getElementById('siteName').value;
    const htmlCode = document.getElementById('htmlCode').value;
    const urlBox = document.getElementById('urlBox');
    const siteLink = document.getElementById('siteLink');

    if (!htmlCode) {
      alert('দয়া করে কিছু HTML কোড লিখুন!');
      return;
    }

    urlBox.style.display = 'block';
    urlBox.style.borderColor = '#eab308';
    urlBox.innerHTML = '<span style="color: #eab308;">⏳ ক্লাউড হোস্টিংয়ে ডেপ্লয় হচ্ছে... অপেক্ষা করুন...</span>';

    try {
      const res = await fetch('/api/site', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ siteName: siteName, htmlCode: htmlCode })
      });

      const data = await res.json();

      if (data.success) {
        urlBox.style.borderColor = '#22c55e';
        urlBox.innerHTML = `
          <p style="color: #22c55e; margin: 0 0 10px 0;"><b>🎉 ওয়েবসাইট সফলভাবে লাইভ হয়েছে!</b></p>
          <span>সরাসরি ভিজিট করুন: </span><a href="${data.liveUrl}" target="_blank">${data.liveUrl}</a>
        `;
      } else {
        urlBox.style.borderColor = '#ef4444';
        urlBox.innerHTML = `<span style="color: #ef4444;">ব্যর্থ হয়েছে: ${data.error}</span>`;
      }
    } catch (err) {
      urlBox.style.borderColor = '#ef4444';
      urlBox.innerHTML = `<span style="color: #ef4444;">এরর: ${err.message}</span>`;
    }
  }
</script>

</body>
</html>
