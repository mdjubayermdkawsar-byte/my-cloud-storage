<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>আমার ক্লাউড সার্ভার (Storage + Multi-Language Engine)</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
    .box { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; }
    select, button { padding: 10px; border-radius: 5px; font-size: 16px; margin-bottom: 10px; }
    textarea { width: 95%; height: 200px; background: #020617; color: #38bdf8; font-family: monospace; padding: 10px; border-radius: 5px; border: 1px solid #334155; }
    pre { background: #020617; padding: 15px; color: #4ade80; border-radius: 5px; border: 1px solid #334155; overflow-x: auto; }
  </style>
</head>
<body>

<div class="box">
  <h2>⚡ আমার ক্লাউড সার্ভার (অল-ইন-ওয়ান)</h2>
  <p>যেকোনো ভাষার কোড সরাসরি আমাদের সার্ভারে রান করুন (কোনো কিছু ডাউনলোড ছাড়া)</p>

  <label>প্রোগ্রামিং ল্যাঙ্গুয়েজ সিলেক্ট করো:</label><br>
  <select id="lang">
    <option value="python">Python (v3.10)</option>
    <option value="php">PHP (v8.2)</option>
    <option value="java">Java (v15.0)</option>
    <option value="csharp">C# (Mono 6.12)</option>
    <option value="javascript">JavaScript (Node v18)</option>
    <option value="c++">C++ (GCC 10)</option>
  </select><br>

  <label>তোমার কোড লেখো:</label><br>
  <textarea id="code">print("হ্যালো! আমাদের সার্ভার থেকে পাইথন রান হচ্ছে!")</textarea><br>

  <button onclick="runCode()" style="background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold;">▶ কোড রান করো</button>

  <h3>🖥️ সার্ভার রেজাল্ট (Output):</h3>
  <pre id="output">এখানে আউটপুট দেখা যাবে...</pre>
</div>

<script>
  async function runCode() {
    const lang = document.getElementById('lang').value;
    const code = document.getElementById('code').value;
    const output = document.getElementById('output');

    output.innerText = "⏳ সার্ভারে প্রসেসিং এবং রান হচ্ছে...";

    try {
      const res = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: lang, code: code })
      });

      const data = await res.json();
      output.innerText = data.output || "কোনো আউটপুট নেই!";
    } catch (err) {
      output.innerText = "এরর: " + err.message;
    }
  }

  // ল্যাঙ্গুয়েজ পরিবর্তন করলে ডিফল্ট কোড সেট হওয়া
  document.getElementById('lang').addEventListener('change', function() {
    const l = this.value;
    const c = document.getElementById('code');
    if (l === 'python') c.value = 'print("হ্যালো পাইথন!")';
    if (l === 'php') c.value = '<?php echo "হ্যালো PHP!"; ?>';
    if (l === 'java') c.value = 'public class Main {\n  public static void main(String[] args) {\n    System.out.println("হ্যালো Java!");\n  }\n}';
    if (l === 'csharp') c.value = 'using System;\nclass Program {\n  static void Main() {\n    Console.WriteLine("হ্যালো C#!");\n  }\n}';
    if (l === 'javascript') c.value = 'console.log("হ্যালো JavaScript!");';
  });
</script>

</body>
</html>
