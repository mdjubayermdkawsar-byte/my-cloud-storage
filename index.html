<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>আমার ক্লাউড স্টোরেজ সার্ভার</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 90%; }
    input[type="file"] { margin: 20px 0; color: #94a3b8; }
    button { background: #0088cc; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
    button:hover { background: #0077b3; }
    .result { margin-top: 20px; word-break: break-all; font-size: 14px; text-align: left; }
    a { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>☁️ আমার ক্লাউড স্টোরেজ</h2>
    <p style="color: #94a3b8;">যেকোনো ফাইল আপলোড করুন (আনলিমিটেড ফ্রি স্টোরেজ)</p>
    
    <input type="file" id="fileInput"><br>
    <button onclick="uploadFile()">আপলোড করুন</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const resultDiv = document.getElementById('result');

      if (!fileInput.files.length) {
        alert('দয়া করে একটি ফাইল সিলেক্ট করুন!');
        return;
      }

      resultDiv.innerHTML = '<p style="color: #facc15;">⏳ আপলোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>';

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          resultDiv.innerHTML = `
            <p style="color: #4ade80;"><b>✅ সফলভাবে আপলোড হয়েছে!</b></p>
            <p><b>ফাইল নাম:</b> ${data.fileName}</p>
            <p><b>ডাউনলোড লিঙ্ক:</b><br><a href="${data.url}" target="_blank">${data.url}</a></p>
          `;
        } else {
          resultDiv.innerHTML = `<p style="color: #f87171;">❌ ব্যর্থ হয়েছে: ${data.error}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p style="color: #f87171;">❌ এরর: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
